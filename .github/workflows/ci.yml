name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
  IMAGE_TAG: ${{ github.sha }}
  APP_URL: https://amandal.kolynois.com

jobs:
  build-test-scan:
    # Tourne sur push ET pull_request : tests + lint + scans. Ne pousse
    # jamais rien vers ECR et ne touche jamais au repo GitOps -- c'est le
    # job "deploy" ci-dessous qui s'en charge, et lui seul tourne sur push.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          # nodriver n'est pas sur PyPI (cf. Dockerfile) : installé depuis GitHub
          pip install git+https://github.com/ultrafunkamsterdam/nodriver.git

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint with Ruff
        # --exit-zero : les erreurs restent visibles dans les logs mais ne bloquent
        # plus le pipeline (91 erreurs de style/robustesse restantes à traiter au
        # fil de l'eau, cf. ruff check . --statistics en local pour le détail).
        run: ruff check . --exit-zero

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      - name: Build Docker image
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          # Certaines CVE (ex: gstreamer1.0-plugins-bad sur Ubuntu Jammy) n'ont
          # pas encore de correctif publié en amont : bloquer dessus n'apporte
          # rien tant qu'aucun patch n'existe. On ne bloque que sur les CVE
          # réellement corrigeables mais non corrigées.
          ignore-unfixed: true

      - name: Sauvegarder l'image scannée pour le job deploy
        # Le job "deploy" NE rebuild PAS l'image : il pousse exactement celle
        # qui vient d'être testée et scannée ci-dessus. Rebuilder plus tard
        # (avec par ex. un paquet apt mis à jour entre-temps) pourrait pousser
        # en prod une image différente de celle qui a été scannée.
        run: docker save ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  deploy:
    needs: build-test-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image scannée par le job précédent
        run: docker load -i image.tar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Update GitOps repository
        # GITOPS_PUSH_TOKEN : PAT (fine-grained, contents:write) sur le repo
        # flask-gitops---public-veille-immobiliere. Le GITHUB_TOKEN auto-généré
        # par Actions ne peut pas pousser sur un autre repo que celui-ci.
        env:
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_PUSH_TOKEN}@${GITOPS_REPO#https://} gitops
          cd gitops
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|" apps/flask-app/values.yaml
          git config user.email "ci-bot@example.com"
          git config user.name "CI Bot"
          git add apps/flask-app/values.yaml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}" || echo "No changes"
          git push

  smoke-test:
    # Vérifie que le NOUVEAU tag est réellement servi en prod, pas juste
    # qu'un pod répond. Argo CD (automated + selfHeal) synchronise en général
    # sous 3 minutes après le push GitOps -- on poll /health jusqu'à ce que
    # le champ image_tag corresponde au SHA qu'on vient de déployer, avec un
    # timeout large pour couvrir rollout + readiness probe (cf.
    # flask-gitops/apps/flask-app/values.yaml probes.readiness).
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Attendre que ${{ env.IMAGE_TAG }} soit servi par ${{ env.APP_URL }}
        run: |
          set -e
          deadline=$((SECONDS + 420))
          while [ $SECONDS -lt $deadline ]; do
            response=$(curl -fsS --max-time 10 "${APP_URL}/health" || true)
            status=$(echo "$response" | jq -r '.status // empty' 2>/dev/null || true)
            tag=$(echo "$response" | jq -r '.image_tag // empty' 2>/dev/null || true)
            echo "status=$status tag=$tag (attendu: $IMAGE_TAG)"
            if [ "$status" = "healthy" ] && [ "$tag" = "$IMAGE_TAG" ]; then
              echo "OK : $IMAGE_TAG est en ligne et healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timeout (7min) : $APP_URL/health ne sert toujours pas $IMAGE_TAG en état healthy."
          echo "Dernière réponse : $response"
          exit 1
